name: Build BOMCheck Windows EXE

on:
  #push:
   # branches: [ main ]
  workflow_dispatch: # 支持网页手动点按钮编译

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Go mod tidy
        run: go mod tidy

      - name: Cross‑compile Windows amd64 exe
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o BOMCheck.exe main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOMCheck-Windows-amd64
          path: BOMCheck.exe
